<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鼠鼠星球 | 投稿</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <script>
    (function () { try { var t = localStorage.getItem("shushu-planet.theme.v1"); if (!t && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark"; if (t === "dark") document.documentElement.setAttribute("data-theme", "dark") } catch (e) { } })()
  </script>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="./index.html">鼠鼠星球</a>
    <nav class="topnav" aria-label="主导航">
      <a href="./index.html">首页</a>
      <a href="./map.html">星球地图</a>
      <a href="./timeline.html">时光轴</a>
      <a href="./planet-wall.html">纪念星河</a>
      <a class="active" href="./submit.html" aria-current="page">投稿</a>
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深色/浅色模式" title="切换深色/浅色模式">🌙</button>
  </header>

  <main class="shell page-shell">
    <section class="page-hero" aria-labelledby="submit-title">
      <p class="eyebrow">Submission</p>
      <h1 id="submit-title">把鼠鼠送到星球</h1>
      <p class="lede">
        填写下方表单，把鼠鼠的纪念档案提交到鼠鼠星球。提交后进入待审核状态，管理员审核通过后将出现在纪念星河。
      </p>
    </section>

    <section class="submit-layout" aria-label="玩家投稿">
      <form id="submission-form" class="submission-form" enctype="multipart/form-data">

        <!-- 鼠家长信息（选填） -->
        <div class="section-heading">
          <p class="eyebrow">Owner Info</p>
          <h2>鼠家长的信息 <small style="font-weight:400;font-size:0.85rem;color:var(--muted)">（选填）</small></h2>
        </div>
        <div class="form-grid">
          <label>
            <span>抖音号</span>
            <input name="douyin" maxlength="40" placeholder="比如：@奶盖的日常" />
          </label>
          <label>
            <span>小红书号</span>
            <input name="xiaohongshu" maxlength="40" placeholder="比如：@养鼠日记" />
          </label>
          <label>
            <span>B站号</span>
            <input name="bilibili" maxlength="40" placeholder="比如：@仓鼠星球" />
          </label>
        </div>

        <!-- 基本信息 -->
        <div class="section-heading">
          <p class="eyebrow">Basic Info</p>
          <h2>鼠鼠的基本信息</h2>
        </div>
        <div class="form-grid">
          <label>
            <span>玩家昵称</span>
            <input name="playerName" required maxlength="20" placeholder="比如：奶盖的饲养员" />
          </label>
          <label>
            <span>鼠鼠名字</span>
            <input name="name" required maxlength="16" placeholder="比如：奶盖" />
          </label>
          <label>
            <span>鼠鼠种类</span>
            <select name="breedCategory" id="breed-category">
              <option value="">请先选择大类</option>
              <option value="叙利亚仓鼠（金丝熊）">叙利亚仓鼠（金丝熊）</option>
              <option value="加卡利亚仓鼠（三线）">加卡利亚仓鼠（三线）</option>
              <option value="坎贝尔仓鼠（一线）">坎贝尔仓鼠（一线）</option>
              <option value="罗伯罗夫斯基仓鼠（公婆）">罗伯罗夫斯基仓鼠（公婆）</option>
              <option value="其他">其他 / 不确定</option>
            </select>
          </label>
          <label>
            <span>具体品种</span>
            <select name="breed" id="breed-select">
              <option value="">请先选择大类</option>
            </select>
            <input name="breedCustom" id="breed-custom" maxlength="20" placeholder="或手动输入品种"
              style="margin-top:6px;display:none" />
          </label>
          <label>
            <span>抵达鼠星日期</span>
            <input name="arrivedAt" type="date" required />
          </label>
        </div>

        <!-- 照片上传 -->
        <div class="section-heading">
          <p class="eyebrow">Photos</p>
          <h2>鼠鼠的照片（最多三张）</h2>
          <p class="lede">每张照片不超过 5MB，支持 JPG/PNG/WebP 格式。</p>
        </div>
        <div class="photo-uploads">
          <label class="photo-field" id="photo-field-0">
            <span class="photo-label">🐹 鼠鼠睡觉的照片</span>
            <div class="photo-drop">
              <input type="file" name="photos" accept="image/*" data-photo-index="0" hidden />
              <div class="photo-placeholder">
                <span class="photo-icon">📷</span>
                <span>点击上传或拖拽图片</span>
              </div>
              <img class="photo-preview" src="" alt="" hidden />
              <button type="button" class="photo-remove" hidden aria-label="移除照片">✕</button>
            </div>
          </label>
          <label class="photo-field" id="photo-field-1">
            <span class="photo-label">🤲 鼠鼠躺手的照片</span>
            <div class="photo-drop">
              <input type="file" name="photos" accept="image/*" data-photo-index="1" hidden />
              <div class="photo-placeholder">
                <span class="photo-icon">📷</span>
                <span>点击上传或拖拽图片</span>
              </div>
              <img class="photo-preview" src="" alt="" hidden />
              <button type="button" class="photo-remove" hidden aria-label="移除照片">✕</button>
            </div>
          </label>
          <label class="photo-field" id="photo-field-2">
            <span class="photo-label">🏃 鼠鼠越狱中的照片</span>
            <div class="photo-drop">
              <input type="file" name="photos" accept="image/*" data-photo-index="2" hidden />
              <div class="photo-placeholder">
                <span class="photo-icon">📷</span>
                <span>点击上传或拖拽图片</span>
              </div>
              <img class="photo-preview" src="" alt="" hidden />
              <button type="button" class="photo-remove" hidden aria-label="移除照片">✕</button>
            </div>
          </label>
        </div>

        <!-- 故事与地区 -->
        <div class="section-heading">
          <p class="eyebrow">Story &amp; Region</p>
          <h2>鼠鼠和我的故事</h2>
        </div>
        <div class="form-grid">
          <label>
            <span>入驻鼠星的地区</span>
            <select name="region">
              <option>月光谷</option>
              <option>瓜子环</option>
              <option>棉花云</option>
              <option>星砂海</option>
              <option>蜜糖丘</option>
              <option>软绒原</option>
            </select>
          </label>
          <label>
            <span>爱吃的零食</span>
            <input name="food" maxlength="20" placeholder="比如：南瓜籽、苹果干" />
          </label>
          <label>
            <span>性格标签</span>
            <input name="traits" maxlength="60" placeholder="用逗号分隔，比如：亲人, 爱跑轮, 会洗脸" />
          </label>
          <label>
            <span>头像颜色</span>
            <input name="color" type="color" value="#8fd2c8" />
          </label>
          <label class="full-field">
            <span>鼠鼠和我的故事</span>
            <textarea name="memory" required maxlength="2000" rows="6"
              placeholder="写下你和鼠鼠之间最难忘的故事。它怎么来到你身边的？它有什么小习惯？它最喜欢做什么？那些闪闪发亮的小瞬间，都值得被记住……"></textarea>
          </label>
        </div>

        <!-- 确认 -->
        <label class="consent-check">
          <input name="publicConsent" type="checkbox" />
          <span>我同意将这份档案公开展示在纪念星河。未勾选将无法通过审核。</span>
        </label>
        <label class="consent-check">
          <input name="confirm" type="checkbox" required />
          <span>我确认以上信息真实，并理解提交后将进入待审核状态，审核通过后公开展示在纪念星河。</span>
        </label>
        <label class="consent-check">
          <input name="originalConfirm" type="checkbox" required />
          <span>我承诺以上文字和照片均为本人原创或已获得授权，不侵犯他人权益。</span>
        </label>

        <div class="form-actions">
          <button class="button primary" type="submit">提交到鼠鼠星球</button>
          <button class="button ghost" type="reset">清空草稿</button>
        </div>
        <p id="submission-status" class="form-status" aria-live="polite" hidden></p>
      </form>
    </section>
  </main>

  <footer class="site-footer" aria-label="网站备案信息">
    <p class="footer-copy">© 2026 Omw. 保留所有权利.</p>

      <span class="footer-sep">|</span>

        rel="noopener"><img class="gongan-icon" src="./assets/公安标识.png" alt="" width="16"
          height="16" />晋公网安备14042702000017号</a>
    </div>
  </footer>

  <script src="./data/memories.js"></script>
  <script src="./src/app.js"></script>
</body>

</html>
