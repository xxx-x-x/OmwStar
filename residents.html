<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鼠鼠星球 | 星球居民</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <script>
    (function () { try { var t = localStorage.getItem("shushu-planet.theme.v1"); if (!t && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark"; if (t === "dark") document.documentElement.setAttribute("data-theme", "dark") } catch (e) { } })()
  </script>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="./index.html">鼠鼠星球</a>
    <nav class="topnav" aria-label="主导航">
      <a href="./index.html">首页</a>
      <a href="./map.html">星球地图</a>
      <a href="./planet-wall.html">纪念星河</a>
      <a href="./submit.html">投稿</a>
      <a href="./about.html">关于我们</a>
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深色/浅色模式" title="切换深色/浅色模式">🌙</button>
  </header>

  <main class="shell page-shell">
    <section class="page-hero" aria-labelledby="residents-title">
      <p class="eyebrow">Residents</p>
      <h1 id="residents-title">星球居民</h1>
      <p class="lede">
        每一张纪念卡都像一颗小星星。现在可以先在本地记录自己的鼠鼠，未来这里会收录更多玩家心爱的鼠鼠。
      </p>
    </section>

    <section class="stats" aria-label="鼠鼠星球概览">
      <article>
        <span id="total-count">0</span>
        <p>位星球居民</p>
      </article>
      <article>
        <span id="favorite-food">瓜子</span>
        <p>最常出现的小零食</p>
      </article>
      <article>
        <span id="latest-arrival">小星星</span>
        <p>最近点亮的名字</p>
      </article>
    </section>

    <section id="archive" class="archive" aria-label="鼠鼠档案">
      <section class="toolbar" aria-label="筛选和搜索">
        <label class="search-field">
          <span>搜索</span>
          <input id="search-input" type="search" placeholder="名字、昵称、爱吃的、性格..." />
        </label>
        <div class="filters" role="group" aria-label="星球区域">
          <button class="filter active" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button class="filter" type="button" data-filter="月光谷" aria-pressed="false">月光谷</button>
          <button class="filter" type="button" data-filter="瓜子环" aria-pressed="false">瓜子环</button>
          <button class="filter" type="button" data-filter="棉花云" aria-pressed="false">棉花云</button>
          <button class="filter" type="button" data-filter="星砂海" aria-pressed="false">星砂海</button>
          <button class="filter" type="button" data-filter="蜜糖丘" aria-pressed="false">蜜糖丘</button>
          <button class="filter" type="button" data-filter="软绒原" aria-pressed="false">软绒原</button>
        </div>
      </section>
      <div id="cards" class="cards"></div>
    </section>

    <section id="resident-detail" class="resident-page" hidden aria-live="polite"></section>

    <section id="add-memory" class="add-memory" aria-labelledby="add-title">
      <div class="section-heading">
        <p class="eyebrow">New Memory</p>
        <h2 id="add-title">新增一张本地纪念卡</h2>
      </div>
      <form id="memory-form" class="memory-form">
        <p id="memory-form-status" class="form-status" aria-live="polite">
          新增内容只保存在当前浏览器，之后可以编辑或删除。
        </p>
        <label>
          <span>玩家昵称</span>
          <input name="playerName" maxlength="20" placeholder="比如：奶盖的饲养员" />
        </label>
        <label>
          <span>鼠鼠名字</span>
          <input name="name" required maxlength="16" placeholder="比如：奶盖" />
        </label>
        <label>
          <span>鼠鼠昵称</span>
          <input name="nickname" maxlength="20" placeholder="比如：盖盖" />
        </label>
        <label>
          <span>抵达鼠星日期</span>
          <input name="arrivedAt" type="date" />
        </label>
        <label>
          <span>所在区域</span>
          <select name="region">
            <option>月光谷</option>
            <option>瓜子环</option>
            <option>棉花云</option>
            <option>星砂海</option>
            <option>蜜糖丘</option>
            <option>软绒原</option>
          </select>
        </label>
        <label>
          <span>爱吃的</span>
          <input name="food" maxlength="20" placeholder="比如：冻干豆腐" />
        </label>
        <label>
          <span>头像色块</span>
          <input name="color" type="color" value="#8fd2c8" />
        </label>
        <label>
          <span>性格标签</span>
          <input name="traits" maxlength="60" placeholder="用逗号分隔，比如：亲人, 爱跑轮" />
        </label>
        <label>
          <span>一句话纪念</span>
          <textarea name="memory" required maxlength="180" placeholder="写下最想记住的那一幕"></textarea>
        </label>
        <div class="form-actions">
          <button class="button primary" id="memory-submit" type="submit">点亮这颗星</button>
          <button class="button ghost" id="cancel-edit" type="button" hidden>取消编辑</button>
          <button class="button ghost" id="clear-local" type="button">清除本地新增</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer" aria-label="网站备案信息">
    <p class="footer-copy">© 2026 Omw. 保留所有权利.</p>
    <div class="footer-links">
      <a href="./privacy.html">隐私政策</a>
      <a href="./terms.html">用户协议</a>
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">晋ICP备2022009437号-1</a>
      <span class="footer-sep">|</span>
      <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=14042702000017" target="_blank"
        rel="noopener"><img class="gongan-icon" src="./assets/公安标识.png" alt="" width="16"
          height="16" />晋公网安备14042702000017号</a>
    </div>
  </footer>

  <script src="./data/memories.js"></script>
  <script src="./src/app.js"></script>
</body>

</html>
