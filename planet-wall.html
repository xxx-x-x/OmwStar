  <main class="shell page-shell">
    <section class="page-hero wall-hero" aria-labelledby="wall-title">
      <p class="eyebrow">Memory Galaxy</p>
      <h1 id="wall-title">纪念星河</h1>
      <p class="lede">
        每一颗星星都是一位已经抵达鼠星、被认真爱过的鼠鼠。这里永远安静，永远不排名——只负责把那些闪闪发亮的小瞬间，挂在这片星河里。还在地球的故事，请去<a href="./earth-letters.html">地球来信</a>。
      </p>
      <div class="wall-stats-bar" id="wall-stats-bar" aria-label="星河统计">
        <span><strong id="wall-star-count">0</strong> 颗星星</span>
        <span class="wall-stats-divider" aria-hidden="true">·</span>
        <span><strong id="wall-light-total">0</strong> 盏小灯被点亮</span>
      </div>
    </section>

    <section class="wall-section" aria-labelledby="wall-list-title">
      <div class="section-heading wall-section-head">
        <div>
          <p class="eyebrow">Stars in the Galaxy</p>
          <h2 id="wall-list-title">星河里的鼠鼠们</h2>
        </div>
        <div class="wall-filter-groups">
          <div class="wall-filters" role="group" aria-label="按星域筛选">
            <button class="filter active" type="button" data-wall-filter="all" aria-pressed="true">全部星域</button>
            <button class="filter" type="button" data-wall-filter="月光谷" aria-pressed="false">月光谷</button>
            <button class="filter" type="button" data-wall-filter="瓜子环" aria-pressed="false">瓜子环</button>
            <button class="filter" type="button" data-wall-filter="棉花云" aria-pressed="false">棉花云</button>
            <button class="filter" type="button" data-wall-filter="星砂海" aria-pressed="false">星砂海</button>
            <button class="filter" type="button" data-wall-filter="蜜糖丘" aria-pressed="false">蜜糖丘</button>
            <button class="filter" type="button" data-wall-filter="软绒原" aria-pressed="false">软绒原</button>
          </div>
        </div>
      </div>
      <div id="wall-cards" class="wall-cards" aria-live="polite"></div>
    </section>
