  <main class="shell home-shell">
    <section id="home" class="hero" aria-labelledby="page-title">
      <div class="hero-art" aria-hidden="true">
        <div class="planet">
          <span class="planet-ring"></span>
          <span class="planet-face">⌒ ⌒</span>
        </div>
        <span class="star star-one"></span>
        <span class="star star-two"></span>
        <span class="star star-three"></span>
      </div>

      <div class="hero-copy">
        <p class="eyebrow">Players' Memory Archive</p>
        <h1 id="page-title">鼠鼠星球</h1>
        <p class="lede">
          给各个玩家心爱的鼠鼠留一盏小灯。这里收录已经到达鼠星的小居民，记下它们的名字、性格、爱吃的东西，
          以及那些被认真爱过、闪闪发亮的小瞬间。
        </p>
        <div class="hero-actions">
          <a class="button primary" href="./planet-wall.html">进入纪念星河</a>
          <a class="button ghost" href="./map.html">探索星球地图</a>
          <a class="button ghost" href="./submit.html">为鼠鼠投稿</a>
        </div>
      </div>
    </section>

    <section class="stats" aria-label="鼠鼠星球概览">
      <article>
        <span id="total-count">0</span>
        <p>位星球居民</p>
      </article>
      <article>
        <span id="favorite-food">瓜子</span>
        <p>最常出现的小零食</p>
      </article>
      <article>
        <span id="latest-arrival">小星星</span>
        <p>最近点亮的名字</p>
      </article>
    </section>
  </main>
